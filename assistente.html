<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>HairOS · Assistente</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#0a0808">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HairOS">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a0808;
            --surface: #12100e;
            --surface2: #1a1612;
            --gold: #c9a96e;
            --gold-dim: rgba(201, 169, 110, 0.15);
            --gold-light: #e8d5a8;
            --gold-glow: rgba(201, 169, 110, .12);
            --text: #f0ebe4;
            --text-sec: #d4c9bc;
            --muted: #8a8278;
            --border: rgba(201, 169, 110, 0.08);
            --border-soft: rgba(255, 255, 255, 0.04);
            --border-gold: rgba(201, 169, 110, 0.25);
            --user: #1a1612;
            --bot: #12100e;
            --green: #3d9a6a;
            --radius: 16px;
            --ease-luxury: cubic-bezier(.23, 1, .32, 1);
            --focus-ring: 0 0 0 3px rgba(201, 169, 110, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Loading */
        @keyframes logoZoomIn {
            0% { opacity: 0; transform: scale(0.1); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes logoZoomOut {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(8); opacity: 0; }
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loading-logo {
            font-family: 'Playfair Display', serif;
            font-size: 3.2rem;
            font-weight: 700;
            font-style: italic;
            color: var(--text);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 4px;
            animation: logoZoomIn 4.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            will-change: transform, opacity;
        }
        .loading-logo.zoom-out {
            animation: logoZoomOut 1.5s cubic-bezier(0.77, 0, 0.175, 1) forwards;
        }
        .loading-logo span {
            color: var(--gold);
            text-shadow: 0 0 60px var(--gold-glow);
        }
        .loading-logo .dot {
            color: var(--gold);
            font-size: 3rem;
        }
        .loading-bar {
            margin-top: 28px;
            width: min(210px, 64vw);
            height: 3px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            transition: opacity 0.6s ease;
        }
        .loading-bar-inner {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
            border-radius: 2px;
            transition: width 0.1s linear;
        }
        .loading-text {
            margin-top: 16px;
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 300;
            opacity: 0.4;
            transition: opacity 0.6s ease;
        }
        .loading-percent {
            margin-top: 6px;
            font-size: 0.65rem;
            color: var(--gold);
            font-weight: 400;
            opacity: 0.6;
            transition: opacity 0.6s ease;
        }

        /* App / Header */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100vw;
            max-width: 820px;
            margin: 0 auto;
            background: var(--bg);
        }
        .header {
            flex-shrink: 0;
            padding: 12px 16px;
            background: rgba(18, 14, 12, 0.82);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-gold);
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 16px;
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, var(--gold), transparent);
            pointer-events: none;
        }
        .header-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), #8b6914);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #0a0808;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(201, 169, 110, 0.25);
            border: 1px solid rgba(232, 213, 168, 0.35);
        }
        .header-info h1 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.01em;
        }
        .header-info p {
            font-size: 10px;
            color: var(--muted);
            font-weight: 300;
            letter-spacing: 0.08em;
            opacity: 0.6;
            text-transform: uppercase;
        }
        .header-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .header-link {
            font-size: 9px;
            color: var(--gold);
            text-decoration: none;
            padding: 5px 12px;
            border: 1px solid rgba(201, 169, 110, 0.25);
            border-radius: 100px;
            white-space: nowrap;
            transition: all 0.25s var(--ease-luxury);
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .header-link:hover,
        .header-link:focus-visible {
            background: var(--gold-dim);
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 14px rgba(201, 169, 110, 0.25);
        }
        .header-link svg {
            width: 11px;
            height: 11px;
            fill: var(--gold);
            flex-shrink: 0;
        }
        .header-status {
            font-size: 9px;
            color: var(--green);
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .header-status::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(61, 154, 106, 0.6);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* Chat */
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }
        .chat::-webkit-scrollbar { width: 3px; }
        .chat::-webkit-scrollbar-track { background: transparent; }
        .chat::-webkit-scrollbar-thumb {
            background: var(--gold-dim);
            border-radius: 10px;
        }
        .chat::-webkit-scrollbar-thumb:hover { background: var(--gold); }

        .msg {
            max-width: 88%;
            padding: 11px 15px;
            border-radius: var(--radius);
            font-size: 13px;
            line-height: 1.55;
            animation: fadeIn .35s var(--ease-luxury);
            font-weight: 300;
        }
        .msg.bot:has(.result-card),
        .msg.bot:has(.consultoria-block) {
            max-width: 94%;
            padding: 8px 10px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: none; }
        }
        .msg.bot {
            align-self: flex-start;
            background: var(--bot);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .msg.user {
            align-self: flex-end;
            background: var(--user);
            border: 1px solid var(--border-gold);
            border-bottom-right-radius: 4px;
        }
        .msg strong { color: var(--gold); font-weight: 600; }

        .user-photo {
            max-width: 150px;
            border-radius: 12px;
            border: 1px solid var(--gold);
            margin-top: 6px;
            display: block;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .user-photo:hover { transform: scale(1.02); }

        /* Cards */
        .result-card {
            margin-top: 10px;
            background: var(--surface2);
            border: 1px solid var(--border-gold);
            border-radius: 14px;
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .result-card:hover {
            border-color: rgba(201, 169, 110, 0.45);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 0 20px rgba(201, 169, 110, 0.1);
        }
        .result-hero {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            max-height: 220px;
            overflow: hidden;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .result-hero img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center center;
            display: block;
            transition: transform 0.6s cubic-bezier(.25, .46, .45, .94);
            cursor: pointer;
            background: var(--surface2);
        }
        .result-card:hover .result-hero img { transform: scale(1.04); }
        .result-hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(10, 8, 8, 0) 45%, rgba(10, 8, 8, 0.30) 70%, rgba(10, 8, 8, 0.85) 100%);
            pointer-events: none;
            z-index: 1;
        }
        .result-hero-info {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            z-index: 2;
            text-align: left;
        }
        .result-hero-info .badge {
            display: inline-block;
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--gold);
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid rgba(201, 169, 110, 0.25);
            margin-bottom: 5px;
            font-weight: 600;
        }
        .result-hero-info h3 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.15;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            margin: 0;
        }
        .result-hero-info .subtitle {
            font-size: 0.65rem;
            color: var(--text-sec);
            opacity: 0.85;
            font-weight: 300;
            margin-top: 2px;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
        }
        .result-body { padding: 11px 13px; }
        .result-body p {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.55;
            font-weight: 300;
            margin-bottom: 10px;
        }
        .result-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .result-actions a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 10px;
            font-size: 10px;
            font-weight: 600;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.25s var(--ease-luxury);
            font-family: 'Inter', sans-serif;
            width: 100%;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .result-actions a.btn-ml {
            background: var(--gold);
            color: #0a0808;
            border: none;
        }
        .result-actions a.btn-ml:hover {
            background: var(--gold-light);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(201, 169, 110, 0.25);
        }
        .result-actions a.btn-vitrine {
            background: var(--surface2);
            border: 1px solid var(--gold);
            color: var(--gold);
            font-weight: 600;
        }
        .result-actions a.btn-vitrine:hover {
            background: var(--gold);
            color: #0a0808;
            border-color: var(--gold);
        }

        /* Consultoria */
        .consultoria-block { margin-top: 4px; }
        .consultoria-title {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: var(--gold);
            font-size: 13px;
            margin: 14px 0 6px 0;
            letter-spacing: 0.01em;
        }
        .consultoria-title:first-child { margin-top: 4px; }

        /* Alternativas */
        .alt-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 2px 8px;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory;
        }
        .alt-scroll::-webkit-scrollbar { display: none; }
        .alt-item {
            min-width: 72px;
            max-width: 82px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            scroll-snap-align: start;
            transition: border-color 0.25s, transform 0.25s;
            position: relative;
            display: block;
            cursor: pointer;
            text-decoration: none;
        }
        .alt-item:hover {
            border-color: rgba(201, 169, 110, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
        }
        .alt-item-img {
            width: 100%;
            height: 62px;
            object-fit: cover;
            object-position: center center;
            display: block;
            background: var(--surface2);
            cursor: pointer;
            transition: transform 0.3s;
        }
        .alt-item-img:hover { transform: scale(1.05); }
        .alt-item span {
            display: block;
            font-size: 8.5px;
            color: var(--text-sec);
            font-weight: 500;
            padding: 4px 4px 5px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            pointer-events: none;
        }

        /* Mini produto */
        .mini-product {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 6px;
            transition: border-color 0.25s, transform 0.2s;
            position: relative;
            text-decoration: none;
            cursor: pointer;
        }
        .mini-product:hover {
            border-color: rgba(201, 169, 110, 0.3);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
        }
        .mini-product-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mini-product-img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
            object-position: center center;
            flex-shrink: 0;
            background: var(--surface2);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.3s;
        }
        .mini-product-img:hover { transform: scale(1.08); }
        .mini-product-info { flex: 1; }
        .mini-product-info h4 {
            font-size: 10.5px;
            color: var(--text);
            font-weight: 600;
            margin-bottom: 1px;
            font-family: 'Inter', sans-serif;
        }
        .mini-product-info p {
            font-size: 9px;
            color: var(--muted);
            margin: 0;
            line-height: 1.35;
            font-weight: 300;
        }
        .mini-product-actions {
            display: flex;
            gap: 5px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .mini-product-actions a {
            font-size: 9px;
            padding: 4px 12px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.25s;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.04em;
            text-align: center;
            flex: 1;
            min-width: 70px;
            text-transform: uppercase;
        }
        .mini-product-actions a.btn-ml-mini {
            background: var(--gold);
            color: #0a0808;
            border: none;
        }
        .mini-product-actions a.btn-ml-mini:hover {
            background: var(--gold-light);
            transform: translateY(-1px);
        }
        .mini-product-actions a.btn-vitrine-mini {
            background: var(--surface2);
            border: 1px solid var(--gold);
            color: var(--gold);
        }
        .mini-product-actions a.btn-vitrine-mini:hover {
            background: var(--gold);
            color: #0a0808;
        }
        .refazer-link {
            display: block;
            text-align: center;
            margin-top: 14px;
            color: var(--gold);
            font-size: 10px;
            text-decoration: underline;
            cursor: pointer;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            opacity: 0.85;
            transition: opacity 0.2s;
        }
        .refazer-link:hover {
            opacity: 1;
            text-shadow: 0 0 10px rgba(201, 169, 110, 0.5);
        }

        /* Composer / Quick / Options */
        .quick {
            flex-shrink: 0;
            padding: 8px 12px 6px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            border-top: 1px solid var(--border);
            background: var(--surface);
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .quick::-webkit-scrollbar { display: none; }
        .quick button {
            flex-shrink: 0;
            padding: 6px 13px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 100px;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s var(--ease-luxury);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .quick button:active,
        .quick button:hover {
            border-color: var(--gold);
            color: var(--gold);
            background: var(--gold-dim);
            box-shadow: 0 0 14px rgba(201, 169, 110, 0.2);
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }
        .options button {
            text-align: left;
            padding: 10px 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            font-size: 12px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.25s var(--ease-luxury);
            font-family: 'Inter', sans-serif;
            line-height: 1.4;
        }
        .options button:active,
        .options button:hover {
            border-color: var(--gold);
            background: var(--gold-dim);
            color: var(--gold);
            transform: translateX(2px);
        }
        .options button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--border);
            background: transparent;
            color: var(--muted);
        }

        .composer {
            flex-shrink: 0;
            padding: 8px 12px 12px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 6px;
            align-items: flex-end;
        }
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--gold);
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s var(--ease-luxury);
            padding: 0;
            line-height: 1;
            overflow: hidden;
        }
        .icon-btn:hover,
        .icon-btn:focus-visible {
            border-color: var(--gold);
            background: var(--gold-dim);
            box-shadow: 0 0 14px rgba(201, 169, 110, 0.25);
            outline: none;
        }
        .icon-btn:active {
            background: var(--gold-dim);
            transform: scale(0.95);
        }
        .composer textarea {
            flex: 1;
            resize: none;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 7px 14px;
            color: var(--text);
            font-size: 12.5px;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            max-height: 70px;
            outline: none;
            transition: border 0.25s, box-shadow 0.25s;
            line-height: 1.4;
        }
        .composer textarea:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.12);
        }
        .composer textarea::placeholder {
            color: var(--muted);
            opacity: 0.45;
        }
        .composer button.send {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--gold);
            color: #0a0808;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.25s var(--ease-luxury);
            padding: 0;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .composer button.send:hover {
            background: var(--gold-light);
            transform: scale(1.04);
            box-shadow: 0 0 18px rgba(201, 169, 110, 0.4);
        }

                var media = (cor.r + cor.g + cor.b) / 3;
                var sat = Math.abs(cor.r - media) + Math.abs(cor.g - media) + Math.abs(cor.b - media);
                if (sat < 40 && media > 90 && media < 200) return 'grisalho';
                if (cor.r >= 170 && cor.g >= 140 && cor.b >= 100) return 'loiro';
                if (cor.r >= 140 && cor.g >= 60 && cor.g <= 160 && cor.b <= 100) return 'ruivo';
                if (cor.r < 55 && cor.g < 55 && cor.b < 55) return 'escuro';
                return 'castanho';
            },
            estimarComprimento: function (imgElement) {
                var w = imgElement.naturalWidth || imgElement.width || 0;
                var h = imgElement.naturalHeight || imgElement.height || 0;
                if (!w || !h) return 'medio';
                var ratio = h / w;
                if (ratio > 2.2) return 'longo';
                if (ratio > 1.35) return 'medio';
                return 'curto';
            },
            estimarTextura: function (imgElement) {
                try {
                    var canvas = document.createElement('canvas');
                    var ctx = canvas.getContext('2d');
                    var width = 160, height = 160;
                    canvas.width = width;
                    canvas.height = height;
                    try { ctx.drawImage(imgElement, 0, 0, width, height); } catch (e) { return 'liso'; }
                    var imageData;
                    try { imageData = ctx.getImageData(0, 0, width, height); } catch (e) { return 'liso'; }
                    var data = imageData.data;
                    var soma = 0, total = 0, variacoes = [];
                    for (var y = 2; y < height - 2; y += 2) {
                        for (var x = 2; x < width - 2; x += 2) {
                            var idx = (y * width + x) * 4;
                            var brilho = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
                            var diffs = [];
                            for (var dy = -1; dy <= 1; dy++) {
                                for (var dx = -1; dx <= 1; dx++) {
                                    if (!dx && !dy) continue;
                                    var iv = ((y + dy) * width + (x + dx)) * 4;
                                    var bv = (data[iv] + data[iv + 1] + data[iv + 2]) / 3;
                                    diffs.push(Math.abs(brilho - bv));
                                }
                            }
                            var dm = diffs.reduce(function (a, b) { return a + b; }, 0) / diffs.length;
                            soma += dm;
                            variacoes.push(dm);
                            total++;
                        }
                    }
                    if (!total) return 'liso';
                    variacoes.sort(function (a, b) { return a - b; });
                    var score = (soma / total + variacoes[Math.floor(variacoes.length / 2)]) / 2;
                    if (score > 55) return 'cacheado';
                    if (score > 32) return 'ondulado';
                    return 'liso';
                } catch (e) {
                    return 'liso';
                }
            },
            analisar: function (imgElement) {
                var cores = this.extrairCoresDominantes(imgElement, 6);
                var cor = this.classificarCorCabelo(cores);
                var comprimento = this.estimarComprimento(imgElement);
                var textura = this.estimarTextura(imgElement);
                return {
                    cor: cor,
                    comprimento: comprimento,
                    textura: textura,
                    sugestaoCorte: MotorRecomendacao.resolverCorte(comprimento, textura, 'medio', 'moderno'),
                    sugestaoCor: MotorRecomendacao.resolverCor(cor, 'media', 'natural')
                };
            }
        };

        function gerarProdutosEKit() {
            var prodKeys = Object.keys(styleData).filter(function (k) {
                return styleData[k] && styleData[k].categoria === 'produto' && !String(k).startsWith('user_');
            });
            var kitKeys = Object.keys(styleData).filter(function (k) {
                return styleData[k] && styleData[k].categoria === 'kit' && !String(k).startsWith('user_');
            });
            var ferramentaKeys = Object.keys(styleData).filter(function (k) {
                return styleData[k] && styleData[k].categoria === 'ferramentas' && !String(k).startsWith('user_');
            });

            function shuffle(arr) {
                for (var i = arr.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
                }
                return arr;
            }
            shuffle(prodKeys);
            shuffle(kitKeys);
            shuffle(ferramentaKeys);

            var html = '';

            if (prodKeys[0] || prodKeys[1]) {
                html += '<div class="consultoria-title">Para manter o resultado</div>';
                if (prodKeys[0]) html += buildMiniProduct(styleData[prodKeys[0]]);
                if (prodKeys[1]) html += buildMiniProduct(styleData[prodKeys[1]]);
            }

            if (ferramentaKeys[0]) {
                html += '<div class="consultoria-title">Ferramenta recomendada</div>';
                html += buildMiniProduct(styleData[ferramentaKeys[0]]);
            }

            if (kitKeys.length) {
                var kit = styleData[kitKeys[Math.floor(Math.random() * kitKeys.length)]];
                html += '<div class="consultoria-title">Kit Ideal</div>';
                html += buildMainCard(kit, 'Kit recomendado');
            }

            return html;
        }

        // ============================================================
        var DUVIDAS = [
            { q: 'Como escolher o corte ideal?', a: 'O quiz combina <strong>comprimento + textura + tempo de finalização + estilo</strong>. Cada resposta restringe as opções do catálogo. Use o Quiz de Corte ou envie uma foto.' },
            { q: 'Qual cor agride menos o fio?', a: 'Com manutenção baixa, o motor prioriza <strong>Balayage, Californianas e Babylights</strong>. Técnicas globais fortes (como Ombré) só entram se você aceitar manutenção alta.' },
            { q: 'Os produtos são originais?', a: 'Sim. Trabalhamos com distribuidores oficiais. Os links levam à vitrine e a buscas no Mercado Livre.' },
            { q: 'A análise da foto é precisa?', a: 'É uma <strong>estimativa visual</strong> no seu aparelho. O corte e a cor usam a <strong>mesma lógica dos quizzes</strong> (com defaults de tempo médio e estilo moderno).' },
            { q: 'Qual a diferença entre corte "Blunt" e "Bob"?', a: 'O <strong>Blunt Cut</strong> é reto e sem camadas, enquanto o <strong>Bob</strong> (como o Velvet Bob) tem camadas internas. Ambos estão no catálogo.' },
            { q: 'O que é "BabyLights Morena"?', a: 'São luzes finíssimas que imitam o efeito natural do sol. Perfeito para manutenção baixa. Veja no catálogo de colorações.' },
            { q: 'Qual kit usar para cabelos com coloração?', a: 'Recomendo o <strong>Kit Expert Vitamino Color</strong> para proteção diária, ou <strong>Joico Color Endure</strong> para intensificar o brilho. Ambos no catálogo.' },
            { q: 'Cabelo cacheado: qual corte e produto?', a: 'O <strong>Wolf Cut</strong>, <strong>Shaggy Hair</strong> e <strong>Octopus Cut</strong> são ótimos para cachos. Use <strong>Joico Moisture Mask</strong> para hidratação e o <strong>Difusor Universal</strong> para finalizar.' },
            { q: 'Como manter o brilho do cabelo?', a: 'Use <strong>Kérastase Chronologiste Oil</strong> para brilho intenso e <strong>Expert Serum Kit</strong> para finalização. Ambos no catálogo de produtos e kits.' },
            { q: 'O que é o corte "French Bob"?', a: 'É um Chanel curto na altura do maxilar com franja reta. Clássico, sofisticado e atemporal. Está no catálogo de cortes.' },
            { q: 'O que é "Curtain Bang"?', a: 'É uma <strong>franja cortininha</strong> dividida ao meio que emoldura o rosto suavemente. Versátil, de baixa manutenção e combina com qualquer comprimento. Está no catálogo de cortes.' },
            { q: 'Qual ferramenta usar para cachos?', a: 'O <strong>Difusor Universal</strong> é ideal para preservar a definição dos cachos sem frizz. Já o <strong>Babyliss Cerâmica</strong> cria cachos definidos. Ambos no catálogo de ferramentas.' }
        ];

        function startQuiz(tipo) {
            if (!QUIZZES[tipo]) return;
            resetState();
            state.mode = 'quiz';
            state.quiz = tipo;
            addMsg('Vamos no <strong>' + QUIZZES[tipo].titulo + '</strong>. Cada resposta afina a próxima recomendação.', 'bot');
            quizTimer = setTimeout(function () { quizTimer = null; askNextQuestion(); }, 500);
        }

        function askNextQuestion() {
            var qData = QUIZZES[state.quiz];
            if (!qData) { resetState(); return; }
            if (state.step >= qData.perguntas.length) {
                var key = qData.resolver(state.answers);
                showResult(key, qData.label, qData.categoria);
                return;
            }
            var p = qData.perguntas[state.step];
            var optsHtml = '<div class="options">';
            p.opcoes.forEach(function (op, i) {
                optsHtml += '<button type="button" data-action="opt-' + i + '">' + escapeHtml(op.t) + '</button>';
            });
            optsHtml += '</div>';
            addMsg(escapeHtml(p.q), 'bot', optsHtml);
        }

        function showResult(key, label, categoria) {
            var item = styleData[key];
            if (!item) {
                addMsg('Não encontrei essa recomendação no catálogo. Tente outro perfil ou envie uma foto.', 'bot');
                resetState();
                return;
            }
            var html = '<div class="consultoria-block">';
            html += gerarResultadoCompleto(item, label, categoria);

            if (categoria === 'produto' || categoria === 'kit' || categoria === 'ferramentas') {
                html += gerarProdutosEKit();
            }

            var alts = pickAlternatives(item, categoria, 2);
            if (alts.length >= 1) {
                html += '<div class="consultoria-title">Comparar</div>';
                html += '<div class="compare-grid">';
                html += buildMainCard(item, label);
                html += buildMainCard(alts[0], 'Alternativa');
                html += '</div>';
            }

            html += '<span class="refazer-link" onclick="resetAll()">Refazer consulta</span></div>';
            addMsg('Recomendação alinhada às suas respostas:', 'bot', html);
            resetState();
        }

        function showDuvidasMenu() {
            resetState();
            var html = '<div class="options">';
            DUVIDAS.forEach(function (d, i) {
                html += '<button type="button" data-action="doubt-' + i + '">' + escapeHtml(d.q) + '</button>';
            });
            html += '</div>';
            addMsg('Qual sua dúvida? (' + DUVIDAS.length + ' perguntas baseadas no catálogo)', 'bot', html);
        }

        function resetAll() {
            resetState();
            state.mode = 'idle';
            state.analiseFoto = null;
            addMsg('Vamos de novo. Use os botões abaixo ou digite sua dúvida.', 'bot');
        }
        window.resetAll = resetAll;

        function processarAnaliseImagem(analise) {
            showTyping();
            setTimeout(function () {
                removeTyping();
                var html = '<div class="consultoria-block">';
                var tem = false;

                var corteItem = analise.sugestaoCorte ? styleData[analise.sugestaoCorte] : null;
                var corItem = analise.sugestaoCor ? styleData[analise.sugestaoCor] : null;

                var ferramentaId = MotorRecomendacao.resolverFerramenta(
                    analise.textura === 'cacheado' ? 'cachos' : 'secagem',
                    analise.textura
                );
                var ferramentaItem = ferramentaId ? styleData[ferramentaId] : null;

                if (corteItem) {
                    html += gerarResultadoCompleto(corteItem, 'Corte sugerido', 'corte');
                    tem = true;
                }
                if (corItem) {
                    html += gerarResultadoCompleto(corItem, 'Cor sugerida', 'coloracao');
                    tem = true;
                }
                if (ferramentaItem) {
                    html += gerarResultadoCompleto(ferramentaItem, 'Ferramenta sugerida', 'ferramentas');
                    tem = true;
                }
                if (tem) html += gerarProdutosEKit();
                html += '<span class="refazer-link" onclick="resetAll()">Refazer análise</span></div>';

                if (tem) {
                    var resumo = 'Detectei: <strong>' + analise.comprimento + '</strong> · <strong>' +
                        analise.textura + '</strong> · <strong>' + analise.cor + '</strong>';
                    addMsg(resumo + '<br>Recomendações baseadas na sua foto:', 'bot', html);
                } else {
                    addMsg('Não foi possível montar recomendações. Tente outra foto ou um quiz.', 'bot');
                }
                resetState();
            }, 1800);
        }

        // ============================================================
        // EVENTOS DOM
        // ============================================================
        document.addEventListener('click', function (e) {
            var btn = e.target.closest('button[data-action]');
            if (!btn) return;
            var action = btn.dataset.action;

            if (action === 'quiz-corte') return startQuiz('corte');
            if (action === 'quiz-cor') return startQuiz('cor');
            if (action === 'quiz-produto') return startQuiz('produto');
            if (action === 'quiz-ferramentas') return startQuiz('ferramentas');
            if (action === 'quiz-kit') return startQuiz('kit');
            if (action === 'duvidas') return showDuvidasMenu();
            if (action === 'diagnostico') return startDiagnostico();

            if (action === 'diag-foto') {
                var optsFoto = btn.closest('.options');
                if (optsFoto) optsFoto.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
                return askDiagnosticoImagem();
            }
            if (action === 'diag-skip-foto') {
                var optsSkip = btn.closest('.options');
                if (optsSkip) optsSkip.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
                return pularFotoDiagnostico();
            }

            if (action.indexOf('opt-') === 0 && state.mode === 'quiz') {
                var idx = parseInt(action.split('-')[1], 10);
                var quiz = QUIZZES[state.quiz];
                var question = quiz && quiz.perguntas[state.step];
                if (!question || !question.opcoes[idx] || btn.disabled) return;
                state.answers.push(question.opcoes[idx].v);
                state.step++;
                var opts = btn.closest('.options');
                if (opts) opts.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
                quizTimer = setTimeout(function () { quizTimer = null; askNextQuestion(); }, 450);
                return;
            }

            if (action.indexOf('diag-') === 0 && state.mode === 'diagnostico') {
                var di = parseInt(action.split('-')[1], 10);
                var p = DIAGNOSTICO.perguntas[state.step];
                if (!p || !p.opcoes[di] || btn.disabled) return;
                state.answers.push(p.opcoes[di].v);
                state.step++;
                var opts2 = btn.closest('.options');
                if (opts2) opts2.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
                setTimeout(function () { askDiagnostico(); }, 450);
                return;
            }

            if (action.indexOf('doubt-') === 0) {
                var di2 = parseInt(action.split('-')[1], 10);
                if (DUVIDAS[di2]) {
                    addMsg(DUVIDAS[di2].a, 'bot');
                    var palavras = DUVIDAS[di2].q.toLowerCase().split(' ');
                    var encontrados = [];
                    palavras.forEach(function (p) {
                        if (p.length > 2) {
                            var r = buscarPorPalavra(p);
                            r.forEach(function (item) {
                                if (encontrados.length < 3 && !encontrados.some(function (ee) { return ee.id === item.id; })) {
                                    encontrados.push(item);
                                }
                            });
                        }
                    });
                    if (encontrados.length) {
                        var html = '<div class="consultoria-title">Estilos relacionados</div>' + buildAlternativas(encontrados.slice(0, 3));
                        addMsg('Veja também:', 'bot', html);
                    }
                }
                resetState();
            }
        });

        // ============================================================
        // ENVIAR MENSAGEM
        // ============================================================
        var sendBtn = document.getElementById('sendBtn');
        if (sendBtn) sendBtn.addEventListener('click', sendMessage);

        if (inputEl) {
            inputEl.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            inputEl.addEventListener('input', function () {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 70) + 'px';
            });
        }

        if (cameraBtn) {
            cameraBtn.addEventListener('click', function () { photoInput.click(); });
        }

        if (photoInput) {
            photoInput.addEventListener('change', function (e) {
                if (!e.target.files || !e.target.files[0]) return;
                var file = e.target.files[0];
                if (!file.type || file.type.indexOf('image/') !== 0) {
                    addMsg('Envie uma imagem (foto do cabelo).', 'bot');
                    photoInput.value = '';
                    return;
                }
                var reader = new FileReader();
                reader.onload = function (event) {
                    var img = new Image();
                    img.onload = function () {
                        var analise = AnalisadorImagem.analisar(img);
                        addMsg('Foto enviada:', 'user',
                            '<img src="' + event.target.result + '" class="user-photo" alt="Cabelo" onclick="if(window.openModal)openModal(this.src, \'Sua foto\')">');
                        if (inputEl) inputEl.value = '';

                        if (state.mode === 'diagnostico-foto') {
                            processarDiagnosticoComFoto(analise);
                        } else {
                            processarAnaliseImagem(analise);
                        }
                    };
                    img.onerror = function () {
                        addMsg('Não consegui ler essa imagem. Tente outra.', 'bot');
                    };
                    img.src = event.target.result;
                };
                reader.onerror = function () {
                    addMsg('Erro ao carregar a foto.', 'bot');
                };
                reader.readAsDataURL(file);
                photoInput.value = '';
            });
        }

        function sendMessage() {
            if (!inputEl) return;
            var text = inputEl.value.trim();
            if (!text) return;
            addMsg(escapeHtml(text), 'user');
            inputEl.value = '';
            inputEl.style.height = 'auto';

            if (state.mode === 'quiz' || state.mode === 'diagnostico') {
                addMsg('Responda usando os botões acima.', 'bot');
                return;
            }
            if (state.mode === 'diagnostico-foto') {
                addMsg('Use o botão <strong>📷 Enviar foto</strong> ou clique em <strong>Pular foto</strong> acima.', 'bot');
                return;
            }

            var lower = text.toLowerCase();

            if (lower === '/reset') { resetAll(); return; }
            if (lower === '/ajuda' || lower === '/help') {
                addMsg(
                    'Comandos disponíveis:<br>' +
                    '<strong>/reset</strong> — reiniciar conversa<br>' +
                    '<strong>/ajuda</strong> — esta mensagem<br>' +
                    '<strong>/foto</strong> — abrir câmera<br><br>' +
                    'Use os botões <strong>Cortes, Cores, Produtos, Ferramentas, Kits, Diagnóstico</strong> ou <strong>Dúvidas</strong>.',
                    'bot'
                );
                return;
            }
            if (lower === '/foto') {
                if (photoInput) photoInput.click();
                return;
            }

            showTyping();
            setTimeout(function () {
                removeTyping();
                if (/corte|cabelo curto|bob|pixie|camadas|curtain|franja|soft layers|hush/.test(lower)) startQuiz('corte');
                else if (/cor\b|mecha|luzes|loiro|ruivo|grisalh|coloraç|colorac/.test(lower)) startQuiz('cor');
                else if (/ferramenta|secador|prancha|babyliss|escova|tesoura|navalha|máquina|maquina|difusor|pente|pincel|capa|massageador|luva|touca/.test(lower)) startQuiz('ferramentas');
                else if (/produto|shampoo|máscara|mascara|condicionador/.test(lower)) startQuiz('produto');
                else if (/\bkit\b/.test(lower)) startQuiz('kit');
                else if (/d[uú]vida|ajuda|como|o que/.test(lower)) showDuvidasMenu();
                else if (/diagn[óo]stico|sa[úu]de|quebradi/.test(lower)) startDiagnostico();
                else if (/comparar|diferença|vs/.test(lower)) {
                    addMsg('Para comparar estilos, digite o nome do estilo que você quer ver.', 'bot');
                } else {
                    var results = buscarPorPalavra(text);
                    if (results.length) {
                        var html = '<div class="consultoria-block">';
                        html += '<div class="consultoria-title">🔍 Encontrei ' + results.length + ' resultados para "' + escapeHtml(text) + '"</div>';
                        results.slice(0, 3).forEach(function (item) {
                            var cat = item.categoria || 'estilo';
                            var label = cat === 'corte' ? 'Corte' : cat === 'coloracao' ? 'Cor' : cat === 'kit' ? 'Kit' : cat === 'ferramentas' ? 'Ferramenta' : 'Produto';
                            html += buildMainCard(item, label);
                        });
                        if (results.length > 3) {
                            html += '<p style="color:var(--muted);font-size:10px;text-align:center;">+ ' + (results.length - 3) + ' resultados</p>';
                        }
                        html += '<span class="refazer-link" onclick="resetAll()">Voltar</span></div>';
                        addMsg('Busca:', 'bot', html);
                    } else {
                        addMsg(
                            'Use os quizzes (<strong>Corte, Cor, Produto, Ferramentas ou Kit</strong>), <strong>Diagnóstico</strong> (recomenda kit), ' +
                            'ou busque por palavras-chave.<br><br>' +
                            'Comandos: /reset, /ajuda, /foto',
                            'bot'
                        );
                    }
                }
            }, 700);
        }

        // ============================================================
        // LOADING
        // ============================================================
        function initChatLoading() {
            var loadingScreen = document.getElementById('loadingScreen');
            var loadingLogo = document.getElementById('loadingLogo');
            var loadingBar = document.getElementById('loadingBar');
            var loadingBarContainer = document.getElementById('loadingBarContainer');
            var loadingPercent = document.getElementById('loadingPercent');
            var loadingText = document.getElementById('loadingText');
            if (!loadingScreen) return;

            function finishLoading() {
                if (loadingBarContainer) loadingBarContainer.style.opacity = '0';
                if (loadingText) loadingText.style.opacity = '0';
                if (loadingPercent) loadingPercent.style.opacity = '0';

                setTimeout(function () {
                    if (loadingLogo) loadingLogo.classList.add('zoom-out');
                }, 500);

                setTimeout(function () {
                    if (loadingScreen) loadingScreen.classList.add('hidden');
                }, 1800);
            }

            var currentVal = 0;
            var progressInterval = setInterval(function () {
                currentVal += 1;
                if (currentVal > 100) currentVal = 100;
                if (loadingBar) loadingBar.style.width = currentVal + '%';
                if (loadingPercent) loadingPercent.textContent = currentVal + '%';
                if (currentVal >= 90 && loadingText) loadingText.textContent = 'assistente pronto';
                if (currentVal >= 100) {
                    clearInterval(progressInterval);
                    finishLoading();
                }
            }, 45);

            setTimeout(function () {
                if (currentVal < 100) {
                    clearInterval(progressInterval);
                    currentVal = 100;
                    if (loadingBar) loadingBar.style.width = '100%';
                    if (loadingPercent) loadingPercent.textContent = '100%';
                    if (loadingText) loadingText.textContent = 'assistente pronto';
                    finishLoading();
                }
            }, 8000);
        }

        var appIniciado = false;
        function initApp() {
            if (appIniciado) return;
            appIniciado = true;
            if (typeof styleData === 'undefined' || !styleData || Object.keys(styleData).length === 0) {
                addMsg(
                    'Não foi possível carregar os estilos. Coloque o <strong>data.js</strong> na mesma pasta deste chat.',
                    'bot'
                );
                return;
            }
            var total = Object.keys(styleData).filter(function (k) {
                return !String(k).startsWith('user_');
            }).length;
            addMsg(
                '👋 Olá! Sou o <strong>HairOS Assistente</strong> · ' + total + ' estilos no catálogo.<br><br>' +
                '🎯 <strong>Como posso ajudar:</strong><br>' +
                '• <strong>Cortes</strong> — quiz para encontrar o corte ideal (inclui <strong>Curtain Bang</strong>)<br>' +
                '• <strong>Cores</strong> — quiz para escolher a cor perfeita<br>' +
                '• <strong>Produtos</strong> — quiz para recomendar um produto específico<br>' +
                '• <strong>Ferramentas</strong> — quiz para escolher a ferramenta ideal<br>' +
                '• <strong>Kits</strong> — quiz para recomendar um kit completo<br>' +
                '• <strong>Diagnóstico</strong> — análise (com foto opcional) para recomendar um kit<br>' +
                '• <strong>Dúvidas</strong> — perguntas frequentes sobre o catálogo<br><br>' +
                'Envie uma <strong>foto</strong> ou digite sua dúvida!',
                'bot'
            );
            if (location.hash === '#diagnostico') startDiagnostico();
        }

        window.addEventListener('DOMContentLoaded', function () {
            initChatLoading();
            setTimeout(function () {
                try {
                    initApp();
                } catch (e) {
                    console.error('Erro ao iniciar assistente:', e);
                }
            }, 1900);
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function (err) {
                    console.warn('SW registration failed:', err);
                });
            });
        }
    </script>
